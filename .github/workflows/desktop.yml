name: Motorcontrol Desktop check
on:
  pull_request:
    paths: ['desktop/**', 'dist/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r desktop/requirements.txt
      - run: python -m unittest discover -s desktop -p "test_*.py"
      - run: python desktop/build.py
      - if: runner.os == 'macOS'
        run: |
          "build/desktop/Motorcontrol Desktop.app/Contents/MacOS/Motorcontrol Desktop" --smoke-test
          ditto -c -k --keepParent "build/desktop/Motorcontrol Desktop.app" build/motorcontrol-macos-development.zip
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "build/desktop/Motorcontrol Desktop.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged app failed its smoke test." }
          Copy-Item $exe build/motorcontrol-windows-development.exe
      - uses: actions/upload-artifact@v4
        with:
          name: motorcontrol-development-${{ runner.os }}-${{ runner.arch }}
          path: build/motorcontrol-*-development.*
          if-no-files-found: error
