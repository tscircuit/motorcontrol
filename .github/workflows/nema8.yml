name: Build NEMA8 firmware
on:
  push:
    paths: ['firmware-c/nema8/**', '.gitmodules', '.github/workflows/nema8.yml']
  pull_request:
    paths: ['firmware-c/nema8/**', '.gitmodules', '.github/workflows/nema8.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf libnewlib-dev
      - run: make -C firmware-c/nema8
      - uses: actions/upload-artifact@v4
        with:
          name: nema8-ch32x035
          path: firmware-c/nema8/nema8.bin
