<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Assets · Motorcontrol</title>
  <link rel="stylesheet" href="assets/viewer.css">
  <script type="importmap">
    {"imports":{"three":"./vendor/three/three.module.min.js"}}
  </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <nav aria-label="Motorcontrol" class="mx-auto flex max-w-4xl flex-wrap items-center gap-x-5 gap-y-2 px-4 py-3 text-sm sm:px-6">
      <a class="mr-1 font-semibold" href="/">Motorcontrol</a>
      <a class="text-slate-600 hover:text-blue-700" href="single-motor.html">Single stepper</a>
      <a class="text-slate-600 hover:text-blue-700" href="gantry.html">Gantry</a>
      <a class="text-slate-600 hover:text-blue-700" href="bldc.html">BLDC</a>
      <a class="text-slate-600 hover:text-blue-700" href="firmware.html">Firmware</a>
      <a class="rounded-md bg-blue-50 px-2 py-1 font-medium text-blue-700" aria-current="page" href="assets.html">Assets</a>
    </nav>
  </header>
  <main class="mx-auto max-w-4xl px-4 py-8 sm:px-6">
    <h1 class="text-2xl font-semibold tracking-tight">Assets</h1>
    <p class="mt-1 text-sm text-slate-600">4 mm backface spacers · 1 mm base and four 3 mm sleeves with 45° corner cuts.</p>
    <ul id="assets" aria-label="Printable models" class="mt-5 divide-y divide-slate-200 rounded-lg border border-slate-200 bg-white"></ul>
    <p id="catalog-status" role="status" class="mt-3 text-sm text-slate-600">Loading assets…</p>
    <p class="mt-4 text-xs text-slate-600">
      Compare the hole pitch and clearances with your motor before printing.
      <a class="text-blue-700 underline" href="assets/backface-spacer-4mm.scad" download>OpenSCAD source</a>
    </p>
  </main>
  <template id="asset-row">
    <li>
      <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2 px-4 py-3">
        <div class="min-w-0">
          <h2 class="text-sm font-semibold"></h2>
          <p data-dimensions class="mt-0.5 text-xs tabular-nums text-slate-600"></p>
        </div>
        <div class="flex shrink-0 items-center gap-3 text-sm">
          <a data-download class="rounded-md px-2 py-1.5 font-medium text-blue-700 hover:bg-blue-50" download>STL</a>
          <button type="button" aria-expanded="false" class="w-24 rounded-md border border-slate-300 bg-white px-2 py-1.5 text-sm font-medium hover:bg-slate-50">Preview</button>
        </div>
      </div>
      <div data-panel hidden class="border-t border-slate-200 bg-slate-50 p-3 sm:p-4">
        <div data-model class="relative h-64 overflow-hidden rounded-md border border-slate-200 bg-white sm:h-80">
          <p data-preview-status role="status" class="absolute inset-x-0 top-3 text-center text-sm text-slate-600"></p>
        </div>
        <div class="mt-2 flex flex-wrap justify-between gap-1 text-xs text-slate-600">
          <p>Drag to rotate · Scroll or pinch to zoom</p>
          <a data-drawing class="text-blue-700 underline">Motor drawing</a>
        </div>
      </div>
    </li>
  </template>
  <script type="module" src="assets-viewer.js"></script>
</body>
</html>
